services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./persona.md:/app/persona.md:ro
      - ./stickers.md:/app/stickers.md:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f service || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
